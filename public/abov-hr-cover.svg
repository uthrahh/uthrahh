<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#f6f4ee"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="800" height="34" fill="#16181a"/>
  <circle cx="20" cy="17" r="5" fill="#e0705a"/>
  <circle cx="38" cy="17" r="5" fill="#e0b25a"/>
  <circle cx="56" cy="17" r="5" fill="#5ac26a"/>
  <rect x="90" y="9" width="300" height="16" rx="8" fill="#33302a"/>
  <text x="110" y="21" font-size="10" fill="#c9c4b8">abovhr.vercel.app</text>

  <!-- hero -->
  <text x="40" y="76" font-size="24" font-weight="700" fill="#16181a">Your career, jobs, and learning —</text>
  <text x="40" y="104" font-size="24" font-weight="700" fill="#16181a">in one place.</text>
  <text x="40" y="130" font-size="12.5" fill="#55564f">Search real openings, see why a role fits you, and close the skill gaps that get you there.</text>

  <!-- search bar -->
  <rect x="40" y="150" width="500" height="34" rx="4" fill="#ffffff" stroke="#dbd7ca"/>
  <text x="54" y="172" font-size="11" fill="#6f7066">Job title, skill, or company</text>
  <rect x="550" y="150" width="130" height="34" rx="4" fill="#cc5500"/>
  <text x="615" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Find opportunities</text>

  <!-- recently posted -->
  <text x="40" y="222" font-size="13" font-weight="700" fill="#16181a">Recently posted</text>

  <g font-size="10.5">
    <rect x="40" y="234" width="230" height="86" rx="4" fill="#ffffff" stroke="#dbd7ca"/>
    <text x="52" y="254" font-weight="700" fill="#16181a">Frontend Engineer</text>
    <text x="52" y="270" fill="#55564f">Verdant Systems · Pune · Remote</text>
    <rect x="52" y="280" width="38" height="16" rx="2" fill="#f6e2cf"/>
    <text x="58" y="292" font-size="8.5" fill="#cc5500">React</text>
    <rect x="94" y="280" width="58" height="16" rx="2" fill="#f6e2cf"/>
    <text x="100" y="292" font-size="8.5" fill="#cc5500">TypeScript</text>

    <rect x="285" y="234" width="230" height="86" rx="4" fill="#ffffff" stroke="#dbd7ca"/>
    <text x="297" y="254" font-weight="700" fill="#16181a">Data Analyst</text>
    <text x="297" y="270" fill="#55564f">Northbridge Analytics · Bengaluru</text>
    <rect x="297" y="280" width="30" height="16" rx="2" fill="#f6e2cf"/>
    <text x="302" y="292" font-size="8.5" fill="#cc5500">SQL</text>
    <rect x="331" y="280" width="52" height="16" rx="2" fill="#f6e2cf"/>
    <text x="337" y="292" font-size="8.5" fill="#cc5500">Power BI</text>

    <rect x="530" y="234" width="230" height="86" rx="4" fill="#ffffff" stroke="#dbd7ca"/>
    <text x="542" y="254" font-weight="700" fill="#16181a">ML Intern</text>
    <text x="542" y="270" fill="#55564f">Northbridge Analytics · Hybrid</text>
    <rect x="542" y="280" width="42" height="16" rx="2" fill="#f6e2cf"/>
    <text x="548" y="292" font-size="8.5" fill="#cc5500">Python</text>
    <rect x="588" y="280" width="80" height="16" rx="2" fill="#f6e2cf"/>
    <text x="594" y="292" font-size="8.5" fill="#cc5500">Fresher-friendly</text>
  </g>

  <!-- feature strip -->
  <g font-size="10.5" fill="#55564f">
    <rect x="40" y="340" width="170" height="60" rx="4" fill="#fbfaf6" stroke="#dbd7ca"/>
    <text x="52" y="362" font-weight="700" fill="#16181a">Build skills</text>
    <text x="52" y="378">Structured roadmaps</text>

    <rect x="222" y="340" width="170" height="60" rx="4" fill="#fbfaf6" stroke="#dbd7ca"/>
    <text x="234" y="362" font-weight="700" fill="#16181a">Plan your career</text>
    <text x="234" y="378">Assessment &amp; paths</text>

    <rect x="404" y="340" width="170" height="60" rx="4" fill="#fbfaf6" stroke="#dbd7ca"/>
    <text x="416" y="362" font-weight="700" fill="#16181a">For employers</text>
    <text x="416" y="378">Post jobs, match scores</text>

    <rect x="586" y="340" width="174" height="60" rx="4" fill="#fbfaf6" stroke="#dbd7ca"/>
    <text x="598" y="362" font-weight="700" fill="#16181a">Improve your profile</text>
    <text x="598" y="378">Better match scores</text>
  </g>
</svg>
