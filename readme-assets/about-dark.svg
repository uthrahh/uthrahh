<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="707" viewBox="0 0 1200 707" text-rendering="geometricPrecision" role="img" aria-label="About me: I care about the why behind a system as much as the system itself: what a business needed to see clearly enough to make a decision, and what the data platform had to get right for that to happen."><title>About me: I care about the why behind a system as much as the system itself: what a business needed to see clearly enough to make a decision, and what the data platform had to get right for that to happen.</title><style>@font-face{font-family:'uMono';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'uSerif';src:url(data:font/woff;base64,) format('woff');}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
